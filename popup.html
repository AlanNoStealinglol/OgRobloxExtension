<!DOCTYPE html>
<html>
<head>
  <title>Roblox++ Settings</title>
  <style>
    :root {
      --primary-color: #00B06F;
      --primary-hover: #009A5F;
      --bg-color: #f9f9f9;
      --card-bg: #ffffff;
      --text-color: #2E2E2E;
      --border-color: #E0E0E0;
      --section-gap: 18px;
      --toggle-size: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 0;
      margin: 0;
    }

    .header {
      background-color: var(--primary-color);
      color: white;
      padding: 15px 20px;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
    }

    .header-logo {
      font-size: 22px;
      font-weight: bold;
    }

    .content {
      padding: 0 20px 20px 20px;
    }

    .section {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: var(--section-gap);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--text-color);
    }

    .color-picker-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .color-field {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="color"] {
      border: none;
      border-radius: 4px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      background: none;
    }

    .color-value {
      font-family: monospace;
      font-size: 13px;
      color: #555;
      min-width: 60px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .setting-row:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .setting-label {
      font-size: 14px;
      font-weight: 500;
    }

    /* Toggle Switch */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary-color);
    }

    input:focus + .slider {
      box-shadow: 0 0 1px var(--primary-color);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      outline: none;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
      flex: 1;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #f0f0f0;
      color: #555;
    }

    .btn-secondary:hover {
      background-color: #e5e5e5;
    }

    .status {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: var(--primary-color);
      height: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .status.visible {
      opacity: 1;
    }

    .info-text {
      font-size: 12px;
      color: #777;
      margin-top: 5px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Roblox++</h1>
    <div class="header-logo">R++</div>
  </div>
  
  <div class="content">
    <div class="section">
      <div class="section-title">UI Appearance</div>
      
      <div class="color-picker-container">
        <div class="setting-label">Button Color:</div>
        <div class="color-field">
          <input type="color" id="buttonColor" value="#00B06F">
          <span class="color-value" id="colorValue">#00B06F</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Old Roblox Features</div>
      
      <div class="setting-row">
        <div class="setting-label">Bring Back OG Games</div>
        <label class="toggle-switch">
          <input type="checkbox" id="ogGames" checked>
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="setting-row">
        <div class="setting-label">Bring Back OG Groups</div>
        <label class="toggle-switch">
          <input type="checkbox" id="ogGroups" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <div class="setting-label">Bring Back OG Catalog</div>
        <label class="toggle-switch">
          <input type="checkbox" id="ogCatalog" checked>
          <span class="slider"></span>
        </label>
      </div>
      
      <p class="info-text">These settings help restore classic Roblox naming conventions.</p>
    </div>
    
    <div class="buttons">
      <button class="btn btn-secondary" id="resetSettings">Reset</button>
      <button class="btn btn-primary" id="saveSettings">Save Changes</button>
    </div>
    
    <div class="status" id="status">Settings saved successfully!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
