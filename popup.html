<!DOCTYPE html>
<html>
<head>
  <title>Roblox++ Settings</title>
  <style>
    body {
      width: 250px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    h2 {
      margin-top: 0;
      color: #393B3D;
      font-size: 18px;
    }
    .settings-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .color-picker-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    label {
      font-size: 14px;
      font-weight: 500;
    }
    input[type="color"] {
      border: none;
      width: 30px;
      height: 30px;
      cursor: pointer;
    }
    .color-value {
      font-size: 12px;
      color: #666;
      margin-left: 5px;
    }
    .reset-button {
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 10px;
    }
    .reset-button:hover {
      background-color: #e0e0e0;
    }
    .save-container {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }
    .save-button {
      background-color: #00B06F;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 15px;
      cursor: pointer;
      font-weight: 500;
    }
    .save-button:hover {
      background-color: #009A5F;
    }
    .status {
      font-size: 12px;
      margin-top: 10px;
      color: #00B06F;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <h2>Roblox++ Settings</h2>
  
  <div class="settings-container">
    <div class="color-picker-container">
      <label for="buttonColor">Join Button Color:</label>
      <input type="color" id="buttonColor" value="#00B06F">
      <span class="color-value" id="colorValue">#00B06F</span>
    </div>
    
    <button class="reset-button" id="resetColor">Reset to Default</button>
    
    <div class="save-container">
      <button class="save-button" id="saveSettings">Save Settings</button>
    </div>
    
    <div class="status" id="status">Settings saved!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
